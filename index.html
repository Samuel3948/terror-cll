<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EL JUICIO - VERSIÓN SATÁNICA</title>
    <style>
        /* ============================================================
           ESTILOS PRINCIPALES
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Creepster&family=Cinzel:wght@400;700&display=swap');

        body {
            background: #050505;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            position: relative;
            cursor: default;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(60, 0, 0, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(0, 0, 40, 0.3) 0%, transparent 60%),
                repeating-linear-gradient(45deg,
                    rgba(255, 255, 255, 0.01) 0px,
                    rgba(255, 255, 255, 0.01) 2px,
                    transparent 2px,
                    transparent 8px);
            pointer-events: none;
            z-index: 0;
            animation: fondoLatido 8s infinite alternate;
        }

        @keyframes fondoLatido {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        #particulasCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.3;
        }

        /* ============================================================
           CONTENEDOR 3D
           ============================================================ */
        .container-3d {
            perspective: 1200px;
            perspective-origin: 50% 50%;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            padding: 20px;
        }

        .card-3d {
            background: linear-gradient(145deg, rgba(15, 8, 8, 0.95), rgba(5, 2, 2, 0.98));
            border: 1px solid rgba(80, 20, 20, 0.2);
            border-radius: 30px;
            padding: 40px 45px 50px;
            transform: rotateX(5deg) rotateY(-2deg) translateZ(20px);
            box-shadow:
                0 0 80px rgba(100, 0, 0, 0.15),
                0 0 150px rgba(50, 0, 0, 0.05),
                inset 0 0 60px rgba(0, 0, 0, 0.8),
                inset 0 0 100px rgba(30, 0, 0, 0.2);
            position: relative;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .card-3d:hover {
            transform: rotateX(3deg) rotateY(-1deg) translateZ(30px);
            box-shadow:
                0 0 120px rgba(100, 0, 0, 0.25),
                0 0 200px rgba(50, 0, 0, 0.1),
                inset 0 0 60px rgba(0, 0, 0, 0.8);
        }

        .card-3d::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 32px;
            background: linear-gradient(45deg, rgba(100, 0, 0, 0.1), transparent 30%, transparent 70%, rgba(100, 0, 0, 0.1));
            z-index: -1;
            animation: bordeInfernal 4s infinite alternate;
        }

        @keyframes bordeInfernal {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.01); }
        }

        .marca-agua {
            position: fixed;
            top: 12px; right: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.55rem;
            color: rgba(80, 40, 40, 0.12);
            letter-spacing: 2px;
            z-index: 999;
            pointer-events: none;
            text-transform: uppercase;
            user-select: none;
            font-weight: 300;
            transition: opacity 0.5s;
            text-shadow: 0 0 20px rgba(100, 0, 0, 0.05);
        }
        .marca-agua:hover { opacity: 0.5; }

        .titulo-principal {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 8px;
            color: #5a2a2a;
            text-shadow: 0 0 30px rgba(100, 0, 0, 0.4), 0 0 60px rgba(50, 0, 0, 0.2), 0 4px 0 #1a0a0a;
            margin-bottom: 2px;
            transform: translateZ(30px);
            position: relative;
            animation: tituloLatido 3s infinite alternate;
        }

        @keyframes tituloLatido {
            0% { text-shadow: 0 0 30px rgba(100, 0, 0, 0.4), 0 0 60px rgba(50, 0, 0, 0.2), 0 4px 0 #1a0a0a; transform: translateZ(30px) scale(1); }
            100% { text-shadow: 0 0 50px rgba(150, 0, 0, 0.6), 0 0 100px rgba(80, 0, 0, 0.3), 0 4px 0 #1a0a0a; transform: translateZ(35px) scale(1.02); }
        }

        .titulo-principal::after {
            content: '⚖️';
            position: absolute;
            font-size: 2rem;
            top: -20px; right: 30px;
            animation: parpadeoEstrella 2s infinite alternate;
            filter: drop-shadow(0 0 20px rgba(100, 50, 0, 0.2));
        }

        .demonio-actual {
            text-align: center;
            font-family: 'Creepster', cursive;
            font-size: 1.5rem;
            color: #ff4444;
            letter-spacing: 3px;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            animation: demonioAparece 1s ease-out;
        }

        @keyframes demonioAparece {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .subtitulo-siniestro {
            text-align: center;
            color: #3a2a2a;
            font-size: 0.85rem;
            letter-spacing: 8px;
            border-bottom: 1px solid rgba(60, 30, 30, 0.15);
            padding-bottom: 18px;
            margin-bottom: 22px;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
        }

        @keyframes parpadeoEstrella {
            0% { opacity: 0.3; transform: scale(0.9) rotate(0deg); }
            100% { opacity: 1; transform: scale(1.1) rotate(10deg); }
        }

        .camara-wrapper {
            position: relative;
            width: 140px; height: 105px;
            margin: 0 auto 18px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(60, 20, 20, 0.2);
            box-shadow: 0 0 40px rgba(100, 0, 0, 0.1), inset 0 0 40px rgba(0, 0, 0, 0.9);
            transform: rotateY(2deg) translateZ(10px);
            opacity: 0.6;
            transition: all 0.5s;
        }

        .camara-wrapper:hover {
            opacity: 0.9;
            transform: rotateY(0deg) translateZ(25px) scale(1.02);
            box-shadow: 0 0 60px rgba(100, 0, 0, 0.2);
        }

        #video {
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: grayscale(1) contrast(1.5) brightness(0.5) blur(1px);
        }

        .ojos-rojos {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
            background:
                radial-gradient(ellipse at 35% 40%, rgba(180, 0, 0, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 65% 40%, rgba(180, 0, 0, 0.15) 0%, transparent 40%);
            animation: ojosLatido 3s infinite alternate;
            mix-blend-mode: screen;
        }

        .ojos-rojos::before {
            content: '◉ ◉';
            position: absolute; top: 35%; left: 50%;
            transform: translateX(-50%);
            font-size: 2.8rem;
            color: rgba(150, 0, 0, 0.08);
            letter-spacing: 50px;
            filter: blur(8px);
            animation: ojosParpadeo 4s infinite;
        }

        @keyframes ojosLatido { 0% { opacity: 0.3; transform: scale(1); } 100% { opacity: 0.8; transform: scale(1.1); } }
        @keyframes ojosParpadeo { 0%, 90%, 100% { opacity: 0.08; } 95% { opacity: 0.3; } }

        .sombras-camara {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 4;
            background: radial-gradient(ellipse at 50% 80%, rgba(0, 0, 0, 0.6) 0%, transparent 50%);
            animation: sombrasMovimiento 6s infinite alternate;
        }

        .sombras-camara::after {
            content: '';
            position: absolute; top: 10%; left: 10%; width: 80%; height: 80%;
            background:
                radial-gradient(ellipse at 30% 60%, rgba(20, 0, 0, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(20, 0, 0, 0.3) 0%, transparent 50%);
            filter: blur(15px);
            animation: sombrasForma 8s infinite alternate;
        }

        @keyframes sombrasMovimiento { 0% { transform: scale(1) translateX(0); opacity: 0.3; } 100% { transform: scale(1.1) translateX(-5%); opacity: 0.8; } }
        @keyframes sombrasForma { 0% { transform: scale(1) rotate(0deg); opacity: 0.3; } 100% { transform: scale(1.3) rotate(5deg); opacity: 0.9; } }

        .distorsion-camara {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 6;
            background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.1) 2px, rgba(0, 0, 0, 0.1) 4px);
            animation: distorsionGlitch 0.1s infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .distorsion-camara.activa { opacity: 0.5; animation: distorsionGlitch 0.05s infinite; }

        @keyframes distorsionGlitch {
            0% { transform: translateY(0); } 20% { transform: translateY(-5px); } 40% { transform: translateY(5px); }
            60% { transform: translateY(-3px); } 80% { transform: translateY(3px); } 100% { transform: translateY(0); }
        }

        .contador-3d {
            text-align: center; font-size: 0.8rem; color: #4a2a2a;
            letter-spacing: 3px; margin-bottom: 12px; font-family: 'Cinzel', serif;
        }
        .contador-3d span { color: #6a3a3a; font-size: 1rem; font-weight: bold; }

        .pregunta-3d { margin: 12px 0 18px; transform: translateZ(15px); }

        #preguntaInput {
            width: 100%;
            background: rgba(10, 5, 5, 0.8);
            border: none;
            border-bottom: 2px solid rgba(60, 20, 20, 0.15);
            color: #a08a8a;
            font-size: 1.2rem;
            font-family: 'Cinzel', serif;
            padding: 14px 10px;
            outline: none;
            text-align: center;
            transition: all 0.5s;
            border-radius: 5px 5px 0 0;
            text-shadow: 0 0 10px rgba(100, 50, 50, 0.1);
            letter-spacing: 1px;
        }

        #preguntaInput::placeholder { color: #3a2a2a; font-style: italic; font-size: 0.9rem; letter-spacing: 2px; }

        #preguntaInput:focus {
            border-bottom-color: rgba(120, 30, 30, 0.3);
            background: rgba(15, 8, 8, 0.9);
            box-shadow: 0 5px 30px rgba(100, 0, 0, 0.05);
            color: #b09a9a;
        }

        /* ============================================================
           FLECHA PENDULAR
           ============================================================ */
        .flecha-3d-wrapper {
            position: relative;
            height: 210px;
            margin: 25px 0 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateZ(20px);
            perspective: 800px;
        }

        .opciones-3d {
            display: flex;
            justify-content: space-between;
            width: 92%;
            position: relative;
            height: 100%;
            align-items: center;
        }

        .opcion {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 6px;
            transition: all 0.35s ease;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            transform: translateZ(10px);
            position: relative;
        }

        .opcion.si { color: #2a5a2a; transform: translateZ(10px) rotateY(-5deg); text-shadow: 0 0 30px rgba(0, 100, 0, 0.1); }
        .opcion.no { color: #5a2a2a; transform: translateZ(10px) rotateY(5deg); text-shadow: 0 0 30px rgba(100, 0, 0, 0.1); }

        .opcion.si.activo {
            color: #6aff6a !important;
            text-shadow: 0 0 60px rgba(80, 255, 80, 0.4), 0 0 120px rgba(80, 255, 80, 0.2) !important;
            transform: translateZ(50px) rotateY(-8deg) scale(1.15) !important;
            filter: drop-shadow(0 0 30px rgba(80, 255, 80, 0.2));
        }

        .opcion.no.activo {
            color: #ff6a6a !important;
            text-shadow: 0 0 60px rgba(255, 80, 80, 0.4), 0 0 120px rgba(255, 80, 80, 0.2) !important;
            transform: translateZ(50px) rotateY(8deg) scale(1.15) !important;
            filter: drop-shadow(0 0 30px rgba(255, 80, 80, 0.2));
        }

        /* La cuerda cuelga desde el punto de fijación y gira junto con la flecha */
        .cuerda {
            position: absolute;
            top: 0;
            left: 50%;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(80, 30, 30, 0.4), rgba(120, 50, 50, 0.6) 50%, rgba(80, 30, 30, 0.4));
            transform-origin: top center;
            transform: translateX(-50%) rotate(0deg);
            z-index: 1;
            box-shadow: 0 0 20px rgba(100, 50, 50, 0.3);
            animation: cuerdaTension 3s infinite alternate;
            will-change: transform;
        }

        @keyframes cuerdaTension {
            0% { box-shadow: 0 0 20px rgba(100, 50, 50, 0.3); }
            100% { box-shadow: 0 0 30px rgba(150, 50, 50, 0.4); }
        }

        .punto-fijacion {
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            width: 12px; height: 12px;
            background: radial-gradient(circle, #3a1a1a, #1a0a0a);
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 0 20px rgba(100, 50, 50, 0.5);
        }

        #flechaPendulo {
            position: absolute;
            top: 15%; left: 50%;
            transform: translateX(-50%) rotate(0deg);
            transform-origin: top center;
            font-size: 5rem;
            z-index: 10;
            transition: none;
            pointer-events: none;
            line-height: 1;
            filter: drop-shadow(0 0 30px rgba(150, 0, 0, 0.4));
            text-shadow: 0 0 40px rgba(200, 0, 0, 0.3);
            will-change: transform;
        }

        #flechaPendulo::before {
            content: '';
            position: absolute;
            top: 30%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(150, 0, 0, 0.2) 0%, rgba(100, 0, 0, 0.1) 30%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(15px);
            animation: auraSangrienta 2s infinite alternate;
        }

        @keyframes auraSangrienta { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.7; } }

        #flechaPendulo.moviendo { color: #8a3a3a; text-shadow: 0 0 60px rgba(200, 50, 50, 0.3); }
        #flechaPendulo.detenida { color: #ff3333; text-shadow: 0 0 80px rgba(255, 0, 0, 0.5), 0 0 160px rgba(255, 0, 0, 0.2); filter: drop-shadow(0 0 40px rgba(255, 0, 0, 0.3)); }

        /* ============================================================
           GOTAS DE SANGRE (realistas, generadas dinámicamente)
           ============================================================ */
        .gotas-contenedor {
            position: absolute;
            top: 42%;
            left: 0;
            width: 100%;
            height: 58%;
            pointer-events: none;
            z-index: 12;
            overflow: visible;
        }

        .gota-sangre {
            position: absolute;
            top: 0;
            border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
            background: radial-gradient(circle at 32% 28%, #d24545 0%, #8a1010 55%, #4a0808 100%);
            box-shadow: 0 0 4px rgba(120, 0, 0, 0.6), 0 0 1px rgba(255, 120, 120, 0.4) inset;
            opacity: 0;
            animation-name: gotaCaer;
            animation-timing-function: cubic-bezier(0.55, 0.06, 0.68, 0.19);
            animation-fill-mode: forwards;
        }

        .gota-sangre::after {
            content: '';
            position: absolute;
            top: 12%; left: 22%;
            width: 25%; height: 20%;
            background: rgba(255, 180, 180, 0.5);
            border-radius: 50%;
            filter: blur(0.4px);
        }

        @keyframes gotaCaer {
            0%   { transform: translateY(0) scaleY(0.5) scaleX(0.9); opacity: 0; }
            8%   { opacity: 0.95; transform: translateY(2%) scaleY(0.8) scaleX(1); }
            70%  { opacity: 0.9;  transform: translateY(var(--caida, 130px)) scaleY(1.4) scaleX(0.85); }
            88%  { opacity: 0.7;  transform: translateY(calc(var(--caida, 130px) + 5px)) scaleY(0.6) scaleX(1.6); }
            100% { opacity: 0;    transform: translateY(calc(var(--caida, 130px) + 3px)) scaleY(0.25) scaleX(2.1); }
        }

        /* ============================================================
           BOTÓN 3D
           ============================================================ */
        #btnPreguntar {
            background: linear-gradient(145deg, rgba(30, 15, 15, 0.9), rgba(10, 5, 5, 0.95));
            border: 1px solid rgba(80, 30, 30, 0.15);
            color: #6a4a4a;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 16px 55px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s;
            letter-spacing: 5px;
            text-transform: uppercase;
            transform: translateZ(15px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(80, 30, 30, 0.1);
            margin-top: 2px;
            position: relative;
            overflow: hidden;
        }

        #btnPreguntar::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(120, 30, 30, 0.05) 0%, transparent 70%);
            animation: girarBrillo 12s linear infinite;
        }

        @keyframes girarBrillo { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #btnPreguntar:hover:not(:disabled) {
            background: linear-gradient(145deg, rgba(50, 20, 20, 0.95), rgba(20, 10, 10, 0.98));
            border-color: rgba(140, 40, 40, 0.3);
            color: #9a6a6a;
            box-shadow: 0 10px 60px rgba(100, 0, 0, 0.2), inset 0 1px 0 rgba(140, 40, 40, 0.2);
            transform: translateZ(30px) scale(1.03);
        }

        #btnPreguntar:disabled { opacity: 0.25; cursor: not-allowed; transform: translateZ(5px) scale(0.95); }

        /* ============================================================
           HISTORIAL
           ============================================================ */
        .historial-3d {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid rgba(60, 30, 30, 0.08);
            font-size: 0.8rem;
            color: #4a2a2a;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
            line-height: 2;
            font-family: 'Cinzel', serif;
            transform: translateZ(10px);
            background: rgba(10, 5, 5, 0.3);
            border-radius: 10px;
            padding: 15px;
        }

        .historial-3d::-webkit-scrollbar { width: 3px; }
        .historial-3d::-webkit-scrollbar-track { background: #0a0505; }
        .historial-3d::-webkit-scrollbar-thumb { background: #2a1a1a; border-radius: 10px; }

        .historial-3d .entrada { display: flex; justify-content: space-between; padding: 3px 10px; border-bottom: 1px solid rgba(60, 30, 30, 0.04); transition: background 0.3s; }
        .historial-3d .entrada:hover { background: rgba(60, 30, 30, 0.05); }
        .historial-3d .entrada .preg { color: #5a4a4a; }
        .historial-3d .entrada .resp { color: #6a4a4a; font-weight: bold; font-family: 'Cinzel', serif; letter-spacing: 1px; font-size: 0.9rem; }
        .historial-3d .entrada .resp.si { color: #4a8a4a; text-shadow: 0 0 15px rgba(60, 200, 60, 0.1); }
        .historial-3d .entrada .resp.no { color: #8a4a4a; text-shadow: 0 0 15px rgba(200, 60, 60, 0.1); }

        /* ============================================================
           OVERLAY DE MIEDO
           ============================================================ */
        .overlay-miedo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.94);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            perspective: 800px;
            backdrop-filter: blur(30px);
        }
        .overlay-miedo.visible { display: flex; }

        .overlay-miedo .contenido-miedo {
            text-align: center;
            font-family: 'Cinzel', serif;
            color: #5a2a2a;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 8px;
            transform: rotateX(10deg) translateZ(60px);
            animation: temblorMiedo 0.08s infinite alternate;
            text-shadow: 0 0 80px rgba(100, 0, 0, 0.4), 0 0 160px rgba(50, 0, 0, 0.15);
        }

        .overlay-miedo .contenido-miedo .sub-miedo {
            font-size: 1.2rem; color: #3a1a1a; margin-top: 20px;
            font-family: 'Cinzel', serif; letter-spacing: 4px;
        }

        @keyframes temblorMiedo {
            0% { transform: rotateX(10deg) translateZ(60px) translateX(-3px); }
            100% { transform: rotateX(10deg) translateZ(60px) translateX(3px); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 600px) {
            .card-3d { padding: 20px 15px 25px; transform: rotateX(2deg) rotateY(0deg) translateZ(10px); }
            .titulo-principal { font-size: 2rem; letter-spacing: 5px; }
            .titulo-principal::after { font-size: 1.2rem; top: -12px; right: 10px; }
            .demonio-actual { font-size: 1.2rem; }
            .opcion { font-size: 2rem; letter-spacing: 3px; }
            #flechaPendulo { font-size: 3.5rem; top: 20%; }
            .flecha-3d-wrapper { height: 160px; }
            #preguntaInput { font-size: 1rem; padding: 12px 8px; }
            #btnPreguntar { font-size: 1rem; padding: 12px 30px; letter-spacing: 3px; }
            .overlay-miedo .contenido-miedo { font-size: 1.8rem; }
            .camara-wrapper { width: 90px; height: 70px; }
            .ojos-rojos::before { font-size: 1.8rem; letter-spacing: 30px; }
            .marca-agua { font-size: 0.4rem; top: 6px; right: 8px; }
            .historial-3d { max-height: 80px; font-size: 0.7rem; padding: 10px; }
        }
    </style>
</head>
<body>

    <canvas id="particulasCanvas"></canvas>

    <div class="marca-agua">DESARROLLADOR:SAMUEL_PDH</div>

    <div class="overlay-miedo" id="overlayMiedo">
        <div class="contenido-miedo">
            <div id="textoMiedo">NO DEBISTE PREGUNTAR ESO</div>
            <div class="sub-miedo">...AHORA SI ESTOY AQUÍ</div>
        </div>
    </div>

    <div class="container-3d">
        <div class="card-3d">

            <div class="titulo-principal">EL JUICIO</div>
            <div class="demonio-actual" id="demonioActual">HOY TE COMUNICASTE CON: BELZEBÚ</div>
            <div class="subtitulo-siniestro">— la balanza decidirá —</div>

            <div class="camara-wrapper" id="camaraWrapper">
                <video id="video" autoplay muted playsinline></video>
                <div class="ojos-rojos"></div>
                <div class="sombras-camara"></div>
                <div class="distorsion-camara" id="distorsionCamara"></div>
            </div>

            <div class="contador-3d">
                ALMAS JUZGADAS: <span id="contadorNum">0</span>
            </div>

            <div class="pregunta-3d">
                <input
                type="text"
                id="preguntaInput"
                placeholder="Escribe tu pregunta..."
                autocomplete="off"
                maxlength="100"
                />
            </div>

            <div class="flecha-3d-wrapper">
                <div class="cuerda" id="cuerda"></div>
                <div class="punto-fijacion"></div>
                <div class="opciones-3d">
                    <span class="opcion si" id="labelSi">SÍ</span>
                    <span class="opcion no" id="labelNo">NO</span>
                </div>
                <div id="flechaPendulo">▼</div>
                <div class="gotas-contenedor" id="gotasContenedor"></div>
            </div>

            <button id="btnPreguntar">PREGUNTAR</button>

            <div class="historial-3d" id="historial">
                <div style="text-align:center; color:#1a0a0a;">— el silencio es la única verdad —</div>
            </div>

        </div>
    </div>

    <script>
        // ================================================================
        //  CONFIGURACIÓN
        // ================================================================
        const CONFIG = {
            duracionMovimiento: 6000,
            anguloMaximo: 40,
            umbralActivacion: 8
        };

        // ================================================================
        //  LISTA DE DEMONIOS
        // ================================================================
        const DEMONIOS = [
            'BELZEBÚ', 'LUCIFER', 'ASTAROTH', 'BELFEGOR', 'LEVIATÁN',
            'MAMÓN', 'ASMODEO', 'SATÁN', 'ABADDÓN', 'MOLOCH'
        ];

        // ================================================================
        //  ESTADO
        // ================================================================
        let contadorPreguntas = parseInt(localStorage.getItem('juicio_contador')) || 0;
        let historial = JSON.parse(localStorage.getItem('juicio_historial')) || [];
        let estaMoviendo = false;
        let animacionId = null;
        let demonioActual = DEMONIOS[Math.floor(Math.random() * DEMONIOS.length)];
        let respuestaActual = null;

        // ================================================================
        //  DOM REFS
        // ================================================================
        const video = document.getElementById('video');
        const preguntaInput = document.getElementById('preguntaInput');
        const btnPreguntar = document.getElementById('btnPreguntar');
        const flecha = document.getElementById('flechaPendulo');
        const cuerda = document.getElementById('cuerda');
        const labelSi = document.getElementById('labelSi');
        const labelNo = document.getElementById('labelNo');
        const contadorNum = document.getElementById('contadorNum');
        const historialDiv = document.getElementById('historial');
        const overlayMiedo = document.getElementById('overlayMiedo');
        const textoMiedo = document.getElementById('textoMiedo');
        const distorsionCamara = document.getElementById('distorsionCamara');
        const demonioActualDiv = document.getElementById('demonioActual');
        const gotasContenedor = document.getElementById('gotasContenedor');

        demonioActualDiv.textContent = `HOY TE COMUNICASTE CON: ${demonioActual}`;

        function cambiarDemonio() {
            demonioActual = DEMONIOS[Math.floor(Math.random() * DEMONIOS.length)];
            demonioActualDiv.textContent = `HOY TE COMUNICASTE CON: ${demonioActual}`;
            demonioActualDiv.style.animation = 'none';
            setTimeout(() => { demonioActualDiv.style.animation = 'demonioAparece 1s ease-out'; }, 10);
        }

        // ================================================================
        //  PARTÍCULAS
        // ================================================================
        const canvas = document.getElementById('particulasCanvas');
        const ctx = canvas.getContext('2d');
        let particulas = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particula {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.tamaño = Math.random() * 2 + 0.5;
                this.velX = (Math.random() - 0.5) * 0.3;
                this.velY = (Math.random() - 0.5) * 0.3;
                this.opacidad = Math.random() * 0.3 + 0.1;
            }
            update() {
                this.x += this.velX;
                this.y += this.velY;
                if (this.x < 0 || this.x > canvas.width) this.velX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.velY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.tamaño, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 30, 30, ${this.opacidad})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) particulas.push(new Particula());

        function animarParticulas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particulas.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animarParticulas);
        }
        animarParticulas();

        // ================================================================
        //  CÁMARA
        // ================================================================
        async function iniciarCamara() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 200, height: 150, facingMode: 'user' } });
                video.srcObject = stream;
            } catch (e) { /* silencio */ }
        }
        iniciarCamara();

        // ================================================================
        //  AUDIO - SONIDOS DE TERROR
        // ================================================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const susurros = [
            'No estás solo...', 'Te observo...', 'JAJAJAJA... no sabes lo que haces',
            'Mira detrás de ti...', 'Ya vi tu cara...', '¿Crees que esto es un juego?',
            'Sabía que vendrías...', 'Nunca te fuiste...'
        ];

        function reproducirSusurro() {
            try {
                const bufferSize = audioCtx.sampleRate * 1.2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const t = i / bufferSize;
                    const envolvente = Math.sin(t * Math.PI) * 0.3;
                    const ruido = (Math.random() * 2 - 1) * 0.1;
                    data[i] = (Math.sin(t * 300 * Math.PI * 2) * 0.2 + ruido) * envolvente;
                }
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.value = 0.06;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 800 + Math.random() * 400;
                filter.Q.value = 1.5;
                source.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                source.start();
                source.stop(audioCtx.currentTime + 1.2);
            } catch (e) { /* silencio */ }
        }

        function reproducirGrito() {
            try {
                const bufferSize = audioCtx.sampleRate * 0.6;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const t = i / bufferSize;
                    const envolvente = Math.sin(t * Math.PI) * 0.5;
                    const frecuencia = 300 + Math.sin(t * 10) * 100;
                    data[i] = Math.sin(t * frecuencia * Math.PI * 2) * envolvente * 0.4;
                    data[i] += (Math.random() * 2 - 1) * 0.15 * envolvente;
                }
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.value = 0.12;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 2000;
                source.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                source.start();
                source.stop(audioCtx.currentTime + 0.6);

                setTimeout(() => {
                    const source2 = audioCtx.createBufferSource();
                    const gain2 = audioCtx.createGain();
                    source2.buffer = buffer;
                    gain2.gain.value = 0.04;
                    source2.connect(filter);
                    filter.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    source2.start();
                    source2.stop(audioCtx.currentTime + 0.5);
                }, 300);
            } catch (e) { /* silencio */ }
        }

        function reproducirSonidoAmbiente() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = 60 + Math.random() * 40;
                osc.type = 'sine';
                gain.gain.value = 0.02;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5 + Math.random() * 2);

                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.frequency.value = 40 + Math.random() * 30;
                    osc2.type = 'sawtooth';
                    gain2.gain.value = 0.01;
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start();
                    osc2.stop(audioCtx.currentTime + 0.3);
                }, 400);
            } catch (e) { /* silencio */ }
        }

        setInterval(() => {
            const random = Math.random();
            if (random < 0.10 && contadorPreguntas > 2) {
                reproducirGrito();
                distorsionCamara.classList.add('activa');
                setTimeout(() => distorsionCamara.classList.remove('activa'), 800);
            } else if (random < 0.25 && contadorPreguntas > 1) {
                reproducirSusurro();
                distorsionCamara.classList.add('activa');
                setTimeout(() => distorsionCamara.classList.remove('activa'), 400);
            } else if (random < 0.40) {
                reproducirSonidoAmbiente();
            }
        }, 4000);

        // ================================================================
        //  GOTAS DE SANGRE
        // ================================================================
        function crearGotaSangre() {
            const gota = document.createElement('div');
            gota.className = 'gota-sangre';

            const xPos = 42 + Math.random() * 16;
            const caida = 95 + Math.random() * 100;
            const duracion = 1.6 + Math.random() * 1.8;
            const ancho = 3.5 + Math.random() * 3.5;

            gota.style.left = xPos + '%';
            gota.style.width = ancho + 'px';
            gota.style.height = (ancho * 1.35) + 'px';
            gota.style.setProperty('--caida', caida + 'px');
            gota.style.animationDuration = duracion + 's';

            gotasContenedor.appendChild(gota);
            setTimeout(() => gota.remove(), duracion * 1000 + 150);
        }

        setInterval(() => { if (Math.random() < 0.55) crearGotaSangre(); }, 900);
        setInterval(() => { if (Math.random() < 0.3) crearGotaSangre(); }, 1600);

        // ================================================================
        //  ACTUALIZAR UI
        // ================================================================
        function actualizarUI() {
            contadorNum.textContent = contadorPreguntas;
            localStorage.setItem('juicio_contador', contadorPreguntas);
            localStorage.setItem('juicio_historial', JSON.stringify(historial));
            renderizarHistorial();
        }

        function renderizarHistorial() {
            if (historial.length === 0) {
                historialDiv.innerHTML = '<div style="text-align:center; color:#1a0a0a;">— el silencio es la única verdad —</div>';
                return;
            }
            let html = '';
            const ultimos = historial.slice(-6).reverse();
            ultimos.forEach(item => {
                const claseResp = item.respuesta === 'SÍ' ? 'si' : 'no';
                html += `
                        <div class="entrada">
                            <span class="preg">${escapeHTML(item.pregunta)}</span>
                            <span class="resp ${claseResp}">${item.respuesta}</span>
                        </div>
                    `;
            });
            historialDiv.innerHTML = html;
        }

        function escapeHTML(texto) {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        // ================================================================
        //  INTELIGENCIA PERTURBADORA - CON VARIABILIDAD
        //  Las preguntas de muerte/miedo ahora son variables (a veces SÍ, a veces NO)
        // ================================================================
        function decidirRespuesta(pregunta) {
            const p = pregunta.toLowerCase().trim();
            
            // Palabras de muerte/miedo - ahora con variabilidad
            const palabrasMiedo = ['morir', 'muerte', 'fin', 'final', 'demonio', 'diablo', 
                                   'infierno', 'matar', 'asesinar', 'suicidio', 'sangre', 'cadáver',
                                   'sepulcro', 'tumba', 'cementerio', 'fantasma', 'espíritu',
                                   'mal', 'oscuro', 'sombra', 'terror', 'pavor'];
            
            // Detectar si la pregunta contiene palabras de miedo
            let contieneMiedo = false;
            let palabraEncontrada = '';
            for (const palabra of palabrasMiedo) {
                if (p.includes(palabra)) {
                    contieneMiedo = true;
                    palabraEncontrada = palabra;
                    break;
                }
            }

            if (contieneMiedo) {
                // Mostrar el overlay de miedo con la palabra encontrada
                mostrarMiedo(`¿${palabraEncontrada.toUpperCase()}?`);
                
                // Decisión VARIABLE: 60% NO, 40% SÍ (para mantener la tensión)
                // Pero con un factor adicional: si el usuario ha preguntado antes sobre esto, 
                // la respuesta tiende a ser la opuesta
                const preguntasAnterioresMiedo = historial.filter(h => {
                    const hLower = h.pregunta.toLowerCase();
                    for (const palabra of palabrasMiedo) {
                        if (hLower.includes(palabra)) return true;
                    }
                    return false;
                });

                // Si ya ha preguntado antes sobre muerte/miedo
                if (preguntasAnterioresMiedo.length > 0) {
                    // Última respuesta sobre miedo
                    const ultimaRespuesta = preguntasAnterioresMiedo[preguntasAnterioresMiedo.length - 1].respuesta;
                    // Tiende a ser la opuesta para crear incertidumbre
                    if (ultimaRespuesta === 'SÍ') {
                        return Math.random() < 0.7 ? 'NO' : 'SÍ'; // 70% NO
                    } else {
                        return Math.random() < 0.7 ? 'SÍ' : 'NO'; // 70% SÍ
                    }
                }

                // Si es la primera vez que pregunta sobre muerte/miedo
                return Math.random() < 0.55 ? 'NO' : 'SÍ'; // 55% NO, 45% SÍ
            }

            // Preguntas sobre el pasado → basado en visitas previas
            if (p.includes('ayer') || p.includes('antes') || p.includes('recuerdas') || p.includes('sabes')) {
                const visitas = parseInt(localStorage.getItem('juicio_visitas')) || 0;
                return visitas > 2 ? 'NO' : 'SÍ';
            }

            // Preguntas repetidas → siempre respuesta opuesta a la anterior
            const preguntasAnteriores = historial.map(h => h.pregunta.toLowerCase());
            if (preguntasAnteriores.includes(p)) {
                const respuestasAnteriores = historial.filter(h => h.pregunta.toLowerCase() === p).map(h => h.respuesta);
                if (respuestasAnteriores.every(r => r === 'SÍ')) return 'NO';
                if (respuestasAnteriores.every(r => r === 'NO')) return 'SÍ';
                return Math.random() < 0.5 ? 'SÍ' : 'NO';
            }

            // Preguntas largas → NO (generalmente)
            if (pregunta.length > 60) return Math.random() < 0.3 ? 'SÍ' : 'NO';

            // Preguntas sobre el futuro → SÍ (generalmente)
            if (p.includes('pasar') || p.includes('futuro') || p.includes('mañana') || p.includes('suceder')) {
                return Math.random() < 0.7 ? 'SÍ' : 'NO';
            }

            // Preguntas emocionales → SÍ (generalmente)
            if (p.includes('querer') || p.includes('amar') || p.includes('gustar') || p.includes('odiar')) {
                return Math.random() < 0.7 ? 'SÍ' : 'NO';
            }

            // Preguntas que contienen "soy malo" → NO (pero con algo de variabilidad)
            if (p.includes('soy malo') || p.includes('soy bueno')) {
                return Math.random() < 0.65 ? 'NO' : 'SÍ';
            }

            // Preguntas sobre "yo" o "mí" → variable
            if (p.includes('yo') || p.includes('mi') || p.includes('mí')) {
                return Math.random() < 0.45 ? 'SÍ' : 'NO';
            }

            // Preguntas sobre "tú" (el demonio) → variable con más NO
            if (p.includes('tú') || p.includes('tu') || p.includes('te') || p.includes('contigo')) {
                return Math.random() < 0.35 ? 'SÍ' : 'NO';
            }

            // Para preguntas normales: decisión por paridad + aleatorio
            const palabras = p.split(' ');
            const numeroPalabras = palabras.length;
            
            if (numeroPalabras % 2 === 0) {
                return Math.random() < 0.55 ? 'SÍ' : 'NO';
            } else {
                return Math.random() < 0.45 ? 'SÍ' : 'NO';
            }
        }

        // ================================================================
        //  MOSTRAR MIEDO
        // ================================================================
        function mostrarMiedo(texto) {
            textoMiedo.textContent = `¿${texto}?`;
            overlayMiedo.classList.add('visible');
            reproducirEstatica();
            setTimeout(() => reproducirGrito(), 200);
            distorsionCamara.classList.add('activa');
            setTimeout(() => {
                overlayMiedo.classList.remove('visible');
                distorsionCamara.classList.remove('activa');
            }, 4500);
        }

        function reproducirEstatica() {
            try {
                const bufferSize = audioCtx.sampleRate * 0.4;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.2;
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.value = 0.15;
                source.connect(gain);
                gain.connect(audioCtx.destination);
                source.start();
                source.stop(audioCtx.currentTime + 0.4);
            } catch (e) { /* silencio */ }
        }

        function reproducirSonidoRespuesta(respuesta) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                if (respuesta === 'SÍ') {
                    osc.frequency.value = 700 + Math.random() * 100;
                    osc.type = 'sine';
                    gain.gain.value = 0.12;
                } else {
                    osc.frequency.value = 150 + Math.random() * 80;
                    osc.type = 'sawtooth';
                    gain.gain.value = 0.1;
                }
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);

                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.frequency.value = respuesta === 'SÍ' ? 500 : 100;
                    osc2.type = 'sine';
                    gain2.gain.value = 0.04;
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start();
                    osc2.stop(audioCtx.currentTime + 0.3);
                }, 200);
            } catch (e) { /* silencio */ }
        }

        // ================================================================
        //  APLICAR ÁNGULO
        // ================================================================
        function aplicarAngulo(angulo) {
            flecha.style.transform = `translateX(-50%) rotate(${angulo}deg)`;
            cuerda.style.transform = `translateX(-50%) rotate(${angulo * 0.4}deg)`;

            if (angulo <= -CONFIG.umbralActivacion) {
                labelSi.classList.add('activo');
                labelNo.classList.remove('activo');
            } else if (angulo >= CONFIG.umbralActivacion) {
                labelNo.classList.add('activo');
                labelSi.classList.remove('activo');
            } else {
                labelSi.classList.remove('activo');
                labelNo.classList.remove('activo');
            }
        }

        // ================================================================
        //  MOVIMIENTO DE LA FLECHA
        // ================================================================
        function moverFlechaConDestino(destino) {
            if (estaMoviendo) return;
            estaMoviendo = true;
            btnPreguntar.disabled = true;
            preguntaInput.disabled = true;

            respuestaActual = destino;

            flecha.classList.remove('detenida');
            flecha.classList.add('moviendo');
            flecha.style.transition = 'none';
            cuerda.style.transition = 'none';
            labelSi.classList.remove('activo');
            labelNo.classList.remove('activo');

            const inicio = performance.now();
            const duracion = CONFIG.duracionMovimiento;
            const anguloFinal = destino === 'SÍ' ? -CONFIG.anguloMaximo * 0.85 : CONFIG.anguloMaximo * 0.85;
            const frecuencia = 1.1 + Math.random() * 0.3;

            if (animacionId) cancelAnimationFrame(animacionId);

            function animar(ahora) {
                const elapsed = ahora - inicio;
                const progreso = Math.min(elapsed / duracion, 1);
                let angulo;

                if (progreso < 0.6) {
                    const t = progreso / 0.6;
                    const amortiguamiento = 1 - t * 0.2;
                    angulo = Math.sin(t * Math.PI * frecuencia * 4) * CONFIG.anguloMaximo * amortiguamiento;
                } else {
                    const t = (progreso - 0.6) / 0.4;
                    const easeT = 1 - Math.pow(1 - t, 3);
                    const oscilacionResidual = Math.sin(t * Math.PI * 2.5) * CONFIG.anguloMaximo * 0.25 * (1 - t);
                    angulo = anguloFinal * easeT + oscilacionResidual;
                }

                aplicarAngulo(angulo);

                if (progreso < 1) {
                    animacionId = requestAnimationFrame(animar);
                } else {
                    aplicarAngulo(anguloFinal);
                    finalizarJuicio(destino);
                }
            }

            animacionId = requestAnimationFrame(animar);
        }

        // ================================================================
        //  FINALIZAR
        // ================================================================
        function finalizarJuicio(respuesta) {
            flecha.classList.remove('moviendo');
            flecha.classList.add('detenida');

            const pregunta = preguntaInput.value.trim();
            if (pregunta) {
                contadorPreguntas++;
                historial.push({ pregunta, respuesta });
                actualizarUI();
                if (contadorPreguntas % 3 === 0) cambiarDemonio();
            }

            reproducirSonidoRespuesta(respuesta);

            setTimeout(() => {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.value = 80;
                    osc.type = 'sine';
                    gain.gain.value = 0.05;
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } catch (e) { /* silencio */ }
            }, 100);

            distorsionCamara.classList.add('activa');
            setTimeout(() => distorsionCamara.classList.remove('activa'), 500);

            const visitas = parseInt(localStorage.getItem('juicio_visitas')) || 0;
            localStorage.setItem('juicio_visitas', visitas + 1);

            setTimeout(() => {
                estaMoviendo = false;
                btnPreguntar.disabled = false;
                preguntaInput.disabled = false;
                preguntaInput.focus();
                preguntaInput.select();

                setTimeout(() => {
                    flecha.style.transition = 'transform 1.6s cubic-bezier(0.45,0,0.55,1)';
                    cuerda.style.transition = 'transform 1.6s cubic-bezier(0.45,0,0.55,1)';
                    flecha.style.transform = 'translateX(-50%) rotate(0deg)';
                    cuerda.style.transform = 'translateX(-50%) rotate(0deg)';

                    setTimeout(() => {
                        labelSi.classList.remove('activo');
                        labelNo.classList.remove('activo');
                        flecha.classList.remove('detenida');
                        flecha.style.transition = 'none';
                        cuerda.style.transition = 'none';
                    }, 1600);
                }, 1500);
            }, 700);
        }

        // ================================================================
        //  MANEJAR PREGUNTA
        // ================================================================
        function hacerPregunta() {
            const pregunta = preguntaInput.value.trim();
            if (!pregunta) {
                preguntaInput.style.borderColor = '#4a1a1a';
                preguntaInput.style.boxShadow = '0 5px 30px rgba(100,0,0,0.15)';
                setTimeout(() => {
                    preguntaInput.style.borderColor = '';
                    preguntaInput.style.boxShadow = '';
                }, 500);
                return;
            }
            if (estaMoviendo) return;

            const respuestaDecidida = decidirRespuesta(pregunta);
            moverFlechaConDestino(respuestaDecidida);
        }

        // ================================================================
        //  EVENTOS
        // ================================================================
        btnPreguntar.addEventListener('click', hacerPregunta);

        preguntaInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                hacerPregunta();
            }
        });

        // ================================================================
        //  DISTORSIÓN ALEATORIA
        // ================================================================
        setInterval(() => {
            if (Math.random() < 0.08 && contadorPreguntas > 1) {
                distorsionCamara.classList.add('activa');
                setTimeout(() => distorsionCamara.classList.remove('activa'), 600);
            }
        }, 5000);

        // ================================================================
        //  INICIALIZAR
        // ================================================================
        actualizarUI();

        setTimeout(() => {
            if (contadorPreguntas === 0) {
                const anguloInicial = 22;
                flecha.style.transition = 'transform 1.8s ease-in-out';
                cuerda.style.transition = 'transform 1.8s ease-in-out';
                flecha.style.transform = `translateX(-50%) rotate(${anguloInicial}deg)`;
                cuerda.style.transform = `translateX(-50%) rotate(${anguloInicial * 0.4}deg)`;
                setTimeout(() => {
                    flecha.style.transform = `translateX(-50%) rotate(-${anguloInicial}deg)`;
                    cuerda.style.transform = `translateX(-50%) rotate(${-anguloInicial * 0.4}deg)`;
                    setTimeout(() => {
                        flecha.style.transform = 'translateX(-50%) rotate(0deg)';
                        cuerda.style.transform = 'translateX(-50%) rotate(0deg)';
                        setTimeout(() => {
                            flecha.style.transition = 'none';
                            cuerda.style.transition = 'none';
                        }, 1600);
                    }, 1600);
                }, 1600);
            }
        }, 800);

        console.log('⚖️ EL JUICIO HA COMENZADO - VERSIÓN CON VARIABILIDAD');
        console.log(`Almas juzgadas: ${contadorPreguntas}`);
        console.log(`Demonio actual: ${demonioActual}`);
        console.log('DESARROLLADOR:SAMUEL_PDH');
        console.log('🔥 Las preguntas de muerte/miedo ahora son VARIABLES (a veces SÍ, a veces NO)');
    </script>

</body>
