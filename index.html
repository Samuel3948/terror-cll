<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Juego Snake estilo terror con skins y controles simples para jugar en la web.">
<title>HULK SNAKE TERROR 💀</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    font-family: 'Arial Black', sans-serif;
    color: #ff0000;
    background: radial-gradient(circle, #2d0000 0%, #000 100%);
  }
  .contenedor {
    width: min(100%, 640px);
    background: rgba(0,0,0,0.88);
    border: 3px solid #ff0000;
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 0 30px rgba(255,0,0,0.35);
  }
  h1 {
    text-align: center;
    font-size: clamp(24px, 4vw, 32px);
    margin-bottom: 10px;
    text-shadow: 0 0 16px #ff0000;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    font-size: 14px;
    color: #00ff00;
  }
  .hud button, .overlay button, .skinBtn, .btn {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .hud button {
    background: #00ff00;
    color: #000;
    padding: 7px 12px;
    border-radius: 999px;
    font-weight: 700;
  }
  .juego {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas {
    display: block;
    width: min(100%, 520px);
    height: auto;
    background: #000;
    border: 6px solid #ff0000;
    border-radius: 18px;
    box-shadow: inset 0 0 20px rgba(255,0,0,0.25);
  }
  .controles {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .fila {
    display: flex;
    gap: 8px;
  }
  .btn {
    width: 58px;
    height: 58px;
    border-radius: 14px;
    font-size: 24px;
    color: #fff;
    background: linear-gradient(145deg, #ff0000, #aa0000);
    box-shadow: 0 5px 0 #880000;
    transition: transform 0.08s ease;
    user-select: none;
  }
  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #880000;
  }
  .sprint {
    background: linear-gradient(145deg, #ffff00, #aaaa00);
    box-shadow: 0 5px 0 #888800;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.8);
    border-radius: 18px;
    z-index: 10;
  }
  .overlay-card {
    width: min(90%, 320px);
    text-align: center;
    background: rgba(10,10,10,0.95);
    border: 3px solid #ff0000;
    border-radius: 18px;
    padding: 22px;
  }
  .overlay-card h2 {
    color: #ff0000;
    font-size: 28px;
    margin-bottom: 10px;
  }
  .overlay-card p {
    color: #00ff00;
    margin-bottom: 14px;
    line-height: 1.4;
  }
  .overlay-card button {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    background: #00ff00;
    color: #000;
    font-weight: 700;
    font-size: 16px;
  }
  .menuSkins {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 20;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.9);
    border-radius: 18px;
  }
  .menuCard {
    width: min(92%, 340px);
    background: #111;
    border: 3px solid #00ff00;
    border-radius: 16px;
    padding: 16px;
    color: #00ff00;
  }
  .menuCard h3 {
    margin-bottom: 10px;
    text-align: center;
    font-size: 20px;
  }
  .skinBtn {
    display: block;
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    background: #1a1a1a;
    color: #00ff00;
    border: 2px solid #00ff00;
    border-radius: 10px;
    text-align: left;
  }
  .skinBtn:hover {
    background: #00ff00;
    color: #000;
  }
  .menuCard button.cerrar {
    margin-top: 8px;
    width: 100%;
    padding: 9px;
    border-radius: 10px;
    background: #ff0000;
    color: white;
    font-weight: 700;
  }
  @media (max-width: 480px) {
    .contenedor { padding: 12px; }
    .btn { width: 52px; height: 52px; font-size: 22px; }
    .hud { font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="contenedor">
    <h1>HULK SNAKE TERROR 💀</h1>
    <div class="hud">
      <span>Puntaje: <strong id="score">0</strong></span>
      <span>Vidas: <strong id="lives">❤️❤️❤️❤️</strong></span>
      <button id="cambiarSkin">Cambiar skin</button>
      <span id="skinNombre">Hulk</span>
    </div>

    <div class="juego">
      <canvas id="game" width="520" height="520"></canvas>

      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">HULK SNAKE TERROR</h2>
          <p id="overlayText">Mueve la serpiente con las flechas o los botones, evita chocar y recoge los 💀.</p>
          <button id="startBtn">JUGAR</button>
        </div>
      </div>

      <div id="menuSkins" class="menuSkins">
        <div class="menuCard">
          <h3>Elige tu gusano</h3>
          <div id="listaSkins"></div>
          <button class="cerrar" onclick="cerrarMenu()">Cerrar</button>
        </div>
      </div>

      <div class="controles">
        <button class="btn" id="up">⬆️</button>
        <div class="fila">
          <button class="btn" id="left">⬅️</button>
          <button class="btn sprint" id="sprint">⚡</button>
          <button class="btn" id="right">➡️</button>
        </div>
        <button class="btn" id="down">⬇️</button>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const startBtn = document.getElementById('startBtn');
const menuSkins = document.getElementById('menuSkins');
const listaSkins = document.getElementById('listaSkins');
const skinNombre = document.getElementById('skinNombre');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');

const canvasSize = 520;
const grid = 20;
const zonaSize = 480;
const offset = (canvasSize - zonaSize) / 2;

const skins = {
  Hulk: { cuerpo: '#00ff00', cabeza: '#00ff00', ojo: 'red', desc: 'El clásico verde' },
  Veneno: { cuerpo: '#6600ff', cabeza: '#9900ff', ojo: 'white', desc: 'Simbionte maldito' },
  Lava: { cuerpo: '#ff4400', cabeza: '#ff8800', ojo: 'yellow', desc: 'Del infierno' },
  Hielo: { cuerpo: '#00ccff', cabeza: '#00ffff', ojo: 'blue', desc: 'Congelante' },
  Toxico: { cuerpo: '#99ff00', cabeza: '#ccff00', ojo: 'black', desc: 'Radioactivo' },
  Sangre: { cuerpo: '#8B0000', cabeza: '#FF0000', ojo: 'white', desc: 'Devora almas' },
  Sombra: { cuerpo: '#222', cabeza: '#444', ojo: 'purple', desc: 'Del vacío' },
  Necro: { cuerpo: '#556B2F', cabeza: '#8B4513', ojo: 'orange', desc: 'No muerto' }
};

let snake = [];
let food = {};
let dx = grid;
let dy = 0;
let puntos = 0;
let vidas = 4;
let sprint = false;
let gameRunning = false;
let loopTimer = null;
let skinActual = 'Hulk';

function crearBotonesSkins() {
  listaSkins.innerHTML = '';
  Object.keys(skins).forEach((nombre) => {
    const btn = document.createElement('button');
    btn.className = 'skinBtn';
    btn.innerHTML = `<b>${nombre}</b> - ${skins[nombre].desc}`;
    btn.addEventListener('click', () => elegirSkin(nombre));
    listaSkins.appendChild(btn);
  });
}

function abrirMenu() { menuSkins.style.display = 'flex'; }
function cerrarMenu() { menuSkins.style.display = 'none'; }
function elegirSkin(nombre) { skinActual = nombre; skinNombre.textContent = nombre; cerrarMenu(); }

function cambiarDireccion(nx, ny) {
  if (dx === -nx && dy === -ny) return;
  if (dx !== 0 && nx !== 0) return;
  if (dy !== 0 && ny !== 0) return;
  dx = nx;
  dy = ny;
}

function crearComida() {
  let nuevaComida;
  do {
    nuevaComida = {
      x: Math.floor(Math.random() * (zonaSize / grid)) * grid + offset,
      y: Math.floor(Math.random() * (zonaSize / grid)) * grid + offset
    };
  } while (snake.some((segmento) => segmento.x === nuevaComida.x && segmento.y === nuevaComida.y));
  food = nuevaComida;
}

function actualizarHud() {
  scoreEl.textContent = puntos;
  livesEl.textContent = '❤️'.repeat(vidas);
}

function dibujarFondo() {
  ctx.clearRect(0, 0, canvasSize, canvasSize);
  ctx.fillStyle = '#030303';
  ctx.fillRect(0, 0, canvasSize, canvasSize);
  ctx.fillStyle = 'rgba(255,0,0,0.12)';
  ctx.fillRect(offset, offset, zonaSize, zonaSize);
  ctx.strokeStyle = 'rgba(255,0,0,0.35)';
  ctx.lineWidth = 1;
  for (let x = offset; x <= offset + zonaSize; x += grid) {
    ctx.beginPath();
    ctx.moveTo(x, offset);
    ctx.lineTo(x, offset + zonaSize);
    ctx.stroke();
  }
  for (let y = offset; y <= offset + zonaSize; y += grid) {
    ctx.beginPath();
    ctx.moveTo(offset, y);
    ctx.lineTo(offset + zonaSize, y);
    ctx.stroke();
  }
}

function dibujarSerpiente(x, y, esCabeza) {
  const skin = skins[skinActual];
  ctx.save();
  ctx.shadowBlur = 12;
  ctx.shadowColor = skin.cabeza;
  ctx.fillStyle = esCabeza ? skin.cabeza : skin.cuerpo;
  ctx.fillRect(x + 2, y + 2, grid - 4, grid - 4);
  ctx.restore();

  if (esCabeza) {
    ctx.fillStyle = 'black';
    ctx.fillRect(x + 6, y + 6, 3, 3);
    ctx.fillRect(x + 12, y + 6, 3, 3);
    ctx.fillStyle = skin.ojo;
    ctx.fillRect(x + 7, y + 7, 1, 1);
    ctx.fillRect(x + 13, y + 7, 1, 1);
  }
}

function dibujarComida() {
  ctx.font = '22px Arial';
  ctx.fillText('💀', food.x + 2, food.y + 19);
}

function render() {
  dibujarFondo();
  dibujarComida();
  snake.forEach((segmento, index) => dibujarSerpiente(segmento.x, segmento.y, index === 0));
}

function mostrarOverlay(titulo, texto) {
  overlayTitle.textContent = titulo;
  overlayText.textContent = texto;
  overlay.style.display = 'flex';
}

function reiniciarJuego() {
  clearTimeout(loopTimer);
  snake = [{ x: offset + 4 * grid, y: offset + 4 * grid }];
  dx = grid;
  dy = 0;
  puntos = 0;
  vidas = 4;
  sprint = false;
  gameRunning = true;
  actualizarHud();
  crearComida();
  render();
  overlay.style.display = 'none';
  loop();
}

function gameOver() {
  gameRunning = false;
  clearTimeout(loopTimer);
  mostrarOverlay('PERDISTE', `Tu puntaje final fue ${puntos}.`);
  startBtn.textContent = 'JUGAR OTRA VEZ';
}

function loop() {
  if (!gameRunning) return;
  const speed = sprint ? 42 : Math.max(70, 140 - puntos * 1.2);
  loopTimer = setTimeout(() => {
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
    const chocaste = head.x < offset || head.x >= offset + zonaSize || head.y < offset || head.y >= offset + zonaSize || snake.some((segmento) => segmento.x === head.x && segmento.y === head.y);

    if (chocaste) {
      vidas -= 1;
      if (vidas <= 0) {
        gameOver();
        return;
      }
      snake = [{ x: offset + 4 * grid, y: offset + 4 * grid }];
      dx = grid;
      dy = 0;
      crearComida();
      actualizarHud();
      render();
      loop();
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      puntos += 10;
      crearComida();
    } else {
      snake.pop();
    }

    actualizarHud();
    render();
    loop();
  }, speed);
}

function manejarTeclado(event) {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) {
    event.preventDefault();
  }
  switch (event.key) {
    case 'ArrowLeft': cambiarDireccion(-grid, 0); break;
    case 'ArrowRight': cambiarDireccion(grid, 0); break;
    case 'ArrowUp': cambiarDireccion(0, -grid); break;
    case 'ArrowDown': cambiarDireccion(0, grid); break;
    case 'Shift': sprint = true; break;
  }
}

function soltarTecla(event) {
  if (event.key === 'Shift') sprint = false;
}

document.getElementById('cambiarSkin').addEventListener('click', abrirMenu);
startBtn.addEventListener('click', reiniciarJuego);

['up', 'down', 'left', 'right'].forEach((id) => {
  const btn = document.getElementById(id);
  btn.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    if (id === 'up') cambiarDireccion(0, -grid);
    if (id === 'down') cambiarDireccion(0, grid);
    if (id === 'left') cambiarDireccion(-grid, 0);
    if (id === 'right') cambiarDireccion(grid, 0);
  });
});

const sprintBtn = document.getElementById('sprint');
sprintBtn.addEventListener('pointerdown', (event) => {
  event.preventDefault();
  sprint = true;
});
sprintBtn.addEventListener('pointerup', () => sprint = false);
sprintBtn.addEventListener('pointerleave', () => sprint = false);
sprintBtn.addEventListener('pointercancel', () => sprint = false);

document.addEventListener('keydown', manejarTeclado);
document.addEventListener('keyup', soltarTecla);

crearBotonesSkins();
actualizarHud();
render();
</script>
</body>
</html>
