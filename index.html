<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEKROPOLIS: CARNAGE EDITION | Zombie Survival FPS</title>
    <style>
        :root {
            --blood: #8b0000;
            --dark: #1a1a1a;
            --bone: #d4c5b2;
            --red: #e63946;
            --gold: #f4a261;
            --ui-bg: rgba(0, 0, 0, 0.7);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            position: fixed;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            z-index: 10;
            pointer-events: none;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
        }
        #crosshair::before {
            left: 50%;
            top: 2px;
            width: 2px;
            height: 16px;
            transform: translateX(-50%);
        }
        #crosshair::after {
            top: 50%;
            left: 2px;
            height: 2px;
            width: 16px;
            transform: translateY(-50%);
        }
        #hitmarker {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 28px;
            height: 28px;
            transform: translate(-50%, -50%) rotate(45deg);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
        }
        #hitmarker::before,
        #hitmarker::after {
            content: '';
            position: absolute;
            background: #fff;
        }
        #hitmarker::before {
            left: 50%;
            top: 2px;
            width: 3px;
            height: 24px;
            transform: translateX(-50%);
        }
        #hitmarker::after {
            top: 50%;
            left: 2px;
            height: 3px;
            width: 24px;
            transform: translateY(-50%);
        }
        #hitmarker.active {
            animation: hitPop 0.2s ease-out;
        }
        @keyframes hitPop {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(45deg) scale(1.4);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(45deg) scale(0.5);
            }
        }
        #damageFlash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 55%, rgba(200, 0, 0, 0.7) 100%);
            z-index: 5;
            opacity: 0;
            transition: opacity 0.06s;
            pointer-events: none;
        }
        #damageFlash.active {
            opacity: 1;
        }
        .hud {
            position: fixed;
            z-index: 8;
            pointer-events: none;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }
        #hudTop {
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        #hudTop span {
            background: var(--ui-bg);
            padding: 4px 12px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #hudHealth {
            bottom: 15px;
            left: 15px;
            background: var(--ui-bg);
            padding: 8px 14px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            min-width: 200px;
        }
        #healthLabel {
            font-size: 11px;
            letter-spacing: 2px;
            color: #aaa;
            margin-bottom: 3px;
        }
        #healthBarBg {
            width: 100%;
            height: 12px;
            background: #2a0000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #5a0000;
        }
        #healthBarFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #8b0000, #e63946);
            transition: width 0.3s;
            border-radius: 6px;
        }
        #healthText {
            font-size: 16px;
            font-weight: bold;
            margin-top: 2px;
        }
        #staminaBar {
            width: 100%;
            height: 4px;
            background: #1a2a1a;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 3px;
        }
        #staminaFill {
            height: 100%;
            width: 100%;
            background: #4caf50;
            transition: width 0.2s;
        }
        #hudAmmo {
            bottom: 15px;
            right: 15px;
            background: var(--ui-bg);
            padding: 10px 16px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: right;
            min-width: 140px;
        }
        #weaponName {
            font-size: 12px;
            letter-spacing: 3px;
            color: #e63946;
            font-weight: bold;
        }
        #ammoMain {
            font-size: 36px;
            font-weight: bold;
            line-height: 1;
        }
        #ammoReserve {
            font-size: 14px;
            color: #aaa;
        }
        #reloadIndicator {
            font-size: 11px;
            color: #f4a261;
            min-height: 16px;
            letter-spacing: 2px;
        }
        #zombieCounter {
            top: 65px;
            right: 15px;
            background: var(--ui-bg);
            padding: 6px 14px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: right;
            font-size: 10px;
            letter-spacing: 1px;
        }
        #zombieCounter b {
            font-size: 22px;
            color: #e63946;
        }
        #waveAnnounce {
            position: fixed;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            text-align: center;
            z-index: 15;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        #waveAnnounce.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #waveAnnounce .big {
            font-size: 48px;
            color: #e63946;
            font-weight: 900;
            letter-spacing: 8px;
            text-shadow: 0 0 30px rgba(230, 57, 70, 0.8), 0 0 60px rgba(180, 0, 0, 0.5);
        }
        #waveAnnounce .sub {
            font-size: 16px;
            color: #d4c5b2;
            letter-spacing: 5px;
            font-weight: bold;
        }
        .screen {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .hidden {
            display: none !important;
        }
        .btn {
            background: rgba(230, 57, 70, 0.2);
            border: 2px solid #e63946;
            color: #fff;
            font-size: 15px;
            padding: 12px 28px;
            margin: 6px;
            cursor: pointer;
            letter-spacing: 3px;
            font-weight: bold;
            transition: all 0.2s;
            pointer-events: all;
            text-transform: uppercase;
            border-radius: 4px;
            font-family: 'Arial', sans-serif;
        }
        .btn:hover {
            background: #e63946;
            box-shadow: 0 0 25px rgba(230, 57, 70, 0.6);
            transform: translateY(-2px);
        }
        .btn:active {
            transform: scale(0.95);
            background: #c1121f;
        }
        .btn-sm {
            font-size: 12px;
            padding: 8px 16px;
            letter-spacing: 2px;
        }
        #touchUI {
            position: fixed;
            inset: 0;
            z-index: 12;
            pointer-events: none;
            display: none;
        }
        #touchUI.on {
            display: block;
        }
        .touch-stick {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.3);
            pointer-events: all;
        }
        .touch-stick .nub {
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .touch-btn {
            position: absolute;
            border-radius: 50%;
            background: rgba(20, 0, 0, 0.8);
            border: 2px solid rgba(230, 57, 70, 0.6);
            color: #e63946;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            pointer-events: all;
            transition: all 0.1s;
        }
        .touch-btn:active {
            background: #e63946;
            color: #fff;
            box-shadow: 0 0 30px rgba(230, 57, 70, 0.9);
            transform: scale(0.85);
        }
        #shopGrid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-width: 500px;
            margin: 10px;
        }
        @media (max-width: 600px) {
            #shopGrid {
                grid-template-columns: 1fr;
            }
            .btn {
                font-size: 13px;
                padding: 10px 18px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="crosshair"></div>
    <div id="hitmarker"></div>
    <div id="damageFlash"></div>

    <div id="hudTop" class="hud">
        <span>🌑 OLEADA <b id="waveNum">1</b></span>
        <span>💀 <b id="scoreNum">0</b></span>
        <span>⚙️ <b id="scrapNum">0</b></span>
    </div>

    <div id="hudHealth" class="hud">
        <div id="healthLabel">SALUD</div>
        <div id="healthBarBg"><div id="healthBarFill"></div></div>
        <div id="healthText"><span id="hpText">100</span> / <span id="maxHpText">100</span></div>
        <div id="staminaBar"><div id="staminaFill"></div></div>
    </div>

    <div id="hudAmmo" class="hud">
        <div id="weaponName">PISTOLA</div>
        <div id="ammoMain"><span id="ammoCount">15</span></div>
        <div id="ammoReserve">/ <span id="ammoReserveVal">60</span></div>
        <div id="reloadIndicator"></div>
    </div>

    <div id="zombieCounter" class="hud">
        ZOMBIES<br><b id="zombieCount">0</b>
    </div>

    <div id="waveAnnounce">
        <div class="big" id="waveBig">OLEADA 1</div>
        <div class="sub" id="waveSub">SOBREVIVE</div>
    </div>

    <div id="touchUI">
        <div class="touch-stick" id="moveStick" style="left:16px; bottom:50px; width:120px; height:120px;">
            <div class="nub" id="moveNub" style="width:48px; height:48px;"></div>
        </div>
        <div class="touch-stick" id="lookStick" style="right:16px; bottom:160px; width:130px; height:130px;">
            <div class="nub" id="lookNub" style="width:44px; height:44px;"></div>
        </div>
        <div class="touch-btn" id="btnShoot" style="right:20px; bottom:320px; width:70px; height:70px; font-size:28px;">🔴</div>
        <div class="touch-btn" id="btnReload" style="right:110px; bottom:340px; width:50px; height:50px; font-size:13px;">R</div>
        <div class="touch-btn" id="btnSwitch" style="right:20px; bottom:420px; width:50px; height:50px; font-size:16px;">⇄</div>
    </div>

    <div id="mainMenu" class="screen">
        <h1 style="font-size:clamp(40px,7vw,60px); color:#e63946; text-shadow:0 0 50px #c1121f,0 0 100px #780000; letter-spacing:12px; font-weight:900;">NEKROPOLIS</h1>
        <p style="color:#d4c5b2; font-size:16px; letter-spacing:8px; margin-bottom:25px;">CARNAGE EDITION</p>
        <button class="btn" id="btnPlay">▶ ENTRAR</button>
        <div style="margin-top:35px; font-size:12px; color:#999; line-height:2.2; text-align:center;">
            <b style="color:#e63946;">PC:</b> P = Avanzar | Q/E = Mirar | Ñ = Disparar | Shift = Correr<br>
            <b style="color:#e63946;">MÓVIL:</b> Joysticks + Botones
        </div>
    </div>

    <div id="gameOverScreen" class="screen hidden">
        <h2 style="color:#e63946; font-size:36px; margin-bottom:10px;">HAS MUERTO</h2>
        <div style="display:flex; gap:40px; margin:15px; text-align:center;">
            <div><div style="font-size:32px; color:#e63946; font-weight:bold;" id="goWave">1</div><div style="font-size:11px; color:#aaa;">OLEADA</div></div>
            <div><div style="font-size:32px; color:#e63946; font-weight:bold;" id="goKills">0</div><div style="font-size:11px; color:#aaa;">BAJAS</div></div>
            <div><div style="font-size:32px; color:#e63946; font-weight:bold;" id="goScore">0</div><div style="font-size:11px; color:#aaa;">PUNTOS</div></div>
        </div>
        <button class="btn" id="btnRetry">REINTENTAR</button>
        <button class="btn" id="btnMenu">MENÚ</button>
    </div>

    <div id="shopScreen" class="screen hidden">
        <h2 style="color:#e63946; font-size:28px; letter-spacing:5px;">TIENDA</h2>
        <p style="font-size:18px; margin:8px;">⚙️ <span id="shopScrap" style="color:#f4a261; font-weight:bold;">0</span></p>
        <div id="shopGrid"></div>
        <button class="btn" id="btnNextWave">SIGUIENTE OLEADA ▶</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== AUDIO REALISTA ====================
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.ready = false;
            }
            init() {
                if (this.ready) return;
                try {
                    this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                    this.master = this.ctx.createGain();
                    this.master.gain.value = 0.4;
                    this.master.connect(this.ctx.destination);
                    this.ready = true;
                } catch (e) {}
            }

            _gunshot(baseFreq, duration, vol) {
                if (!this.ready) return;
                const t = this.ctx.currentTime;

                // Ruido de explosión inicial
                const noiseLen = Math.floor(this.ctx.sampleRate * 0.04);
                const noiseBuf = this.ctx.createBuffer(1, noiseLen, this.ctx.sampleRate);
                const noiseData = noiseBuf.getChannelData(0);
                for (let i = 0; i < noiseLen; i++) noiseData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (noiseLen * 0.3));
                const noiseSrc = this.ctx.createBufferSource();
                noiseSrc.buffer = noiseBuf;
                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(vol * 0.8, t);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
                noiseSrc.connect(noiseGain);
                noiseGain.connect(this.master);
                noiseSrc.start(t);
                noiseSrc.stop(t + 0.04);

                // Tono del disparo
                const osc = this.ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(baseFreq, t);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.3, t + duration);
                const oscGain = this.ctx.createGain();
                oscGain.gain.setValueAtTime(vol * 0.5, t);
                oscGain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.connect(oscGain);
                oscGain.connect(this.master);
                osc.start(t);
                osc.stop(t + duration);

                // Subgrave
                const sub = this.ctx.createOscillator();
                sub.type = 'sine';
                sub.frequency.setValueAtTime(baseFreq * 0.25, t);
                const subGain = this.ctx.createGain();
                subGain.gain.setValueAtTime(vol * 0.6, t);
                subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
                sub.connect(subGain);
                subGain.connect(this.master);
                sub.start(t);
                sub.stop(t + 0.08);

                // Reverberación simulada
                for (let i = 0; i < 3; i++) {
                    const delay = 0.02 + i * 0.03;
                    const echo = this.ctx.createOscillator();
                    echo.type = 'triangle';
                    echo.frequency.setValueAtTime(baseFreq * 0.15, t + delay);
                    const echoGain = this.ctx.createGain();
                    echoGain.gain.setValueAtTime(vol * 0.08 * (1 - i * 0.3), t + delay);
                    echoGain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.06);
                    echo.connect(echoGain);
                    echoGain.connect(this.master);
                    echo.start(t + delay);
                    echo.stop(t + delay + 0.06);
                }
            }

            pistol() { this._gunshot(280, 0.06, 0.5); }
            smg() { this._gunshot(350, 0.04, 0.35); }
            shotgun() { this._gunshot(150, 0.15, 0.7);
                this._gunshot(180, 0.1, 0.5); }
            rifle() { this._gunshot(420, 0.08, 0.6);
                this._gunshot(200, 0.06, 0.4); }

            reload() {
                if (!this.ready) return;
                [0, 0.08, 0.16].forEach((d, i) => {
                    const t = this.ctx.currentTime + d;
                    const o = this.ctx.createOscillator();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(500 + i * 200, t);
                    const g = this.ctx.createGain();
                    g.gain.setValueAtTime(0.08, t);
                    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                    o.connect(g);
                    g.connect(this.master);
                    o.start(t);
                    o.stop(t + 0.05);
                });
            }

            groan() {
                if (!this.ready) return;
                const t = this.ctx.currentTime;
                const o = this.ctx.createOscillator();
                o.type = 'sawtooth';
                const f = 50 + Math.random() * 40;
                o.frequency.setValueAtTime(f, t);
                o.frequency.linearRampToValueAtTime(f * 0.6, t + 0.5);
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.06, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
                const flt = this.ctx.createBiquadFilter();
                flt.type = 'lowpass';
                flt.frequency.value = 400;
                o.connect(flt);
                flt.connect(g);
                g.connect(this.master);
                o.start(t);
                o.stop(t + 0.5);
            }

            death() {
                if (!this.ready) return;
                const t = this.ctx.currentTime;
                const o = this.ctx.createOscillator();
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(80, t);
                o.frequency.exponentialRampToValueAtTime(15, t + 0.4);
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.15, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
                o.connect(g);
                g.connect(this.master);
                o.start(t);
                o.stop(t + 0.4);
            }

            hurt() {
                if (!this.ready) return;
                const t = this.ctx.currentTime;
                const o = this.ctx.createOscillator();
                o.type = 'square';
                o.frequency.setValueAtTime(200, t);
                o.frequency.exponentialRampToValueAtTime(50, t + 0.12);
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.2, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                o.connect(g);
                g.connect(this.master);
                o.start(t);
                o.stop(t + 0.12);
            }

            pickup() {
                if (!this.ready) return;
                [0, 0.05].forEach((d, i) => {
                    const t = this.ctx.currentTime + d;
                    const o = this.ctx.createOscillator();
                    o.type = 'sine';
                    o.frequency.setValueAtTime(600 + i * 350, t);
                    const g = this.ctx.createGain();
                    g.gain.setValueAtTime(0.12, t);
                    g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
                    o.connect(g);
                    g.connect(this.master);
                    o.start(t);
                    o.stop(t + 0.08);
                });
            }

            waveStart() {
                if (!this.ready) return;
                [0, 0.12, 0.24].forEach((d, i) => {
                    const t = this.ctx.currentTime + d;
                    const o = this.ctx.createOscillator();
                    o.type = 'sawtooth';
                    o.frequency.setValueAtTime(90 + i * 25, t);
                    const g = this.ctx.createGain();
                    g.gain.setValueAtTime(0.2, t);
                    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
                    o.connect(g);
                    g.connect(this.master);
                    o.start(t);
                    o.stop(t + 0.2);
                });
            }
        }
        const audio = new AudioEngine();

        // ==================== THREE.JS SETUP ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x3a3a4a);
        scene.fog = new THREE.Fog(0x4a4a5a, 30, 100);

        const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.2, 150);
        camera.position.set(0, 1.75, 8);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true,
            powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;

        // ==================== ILUMINACIÓN CLARA ====================
        scene.add(new THREE.AmbientLight(0x8899aa, 0.8));
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        sunLight.position.set(30, 50, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(2048, 2048);
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 150;
        sunLight.shadow.camera.left = -60;
        sunLight.shadow.camera.right = 60;
        sunLight.shadow.camera.top = 60;
        sunLight.shadow.camera.bottom = -60;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x8899cc, 0.5);
        fillLight.position.set(-20, 10, -15);
        scene.add(fillLight);

        // ==================== MUNDO DETALLADO ====================
        // Suelo de asfalto
        const asphaltCanvas = document.createElement('canvas');
        asphaltCanvas.width = asphaltCanvas.height = 512;

        function createZombieTexture(baseR, baseG, baseB) {
            const cv = document.createElement('canvas');
            cv.width = cv.height = 256;
            const ctx = cv.getContext('2d');
            ctx.fillStyle = `rgb(${baseR},${baseG},${baseB})`;
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 2000; i++) {
                const dr = -25 + Math.random() * 50,
                    dg = -25 + Math.random() * 50,
                    db = -25 + Math.random() * 50;
                ctx.fillStyle =
                    `rgba(${Math.max(0,Math.min(255,baseR+dr))},${Math.max(0,Math.min(255,baseG+dg))},${Math.max(0,Math.min(255,baseB+db))},0.2)`;
                ctx.fillRect(Math.random() * 256, Math.random() * 256, Math.random() * 5, Math.random() * 5);
            }
            // Heridas y manchas de sangre
            for (let i = 0; i < 30; i++) {
                ctx.fillStyle = 'rgba(100,10,10,0.4)';
                ctx.beginPath();
                ctx.arc(Math.random() * 256, Math.random() * 256, 3 + Math.random() * 20, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(cv);
        }

        function createZombieMesh(type) {
            const group = new THREE.Group();
            const s = type === 'brute' ? 1.6 : type === 'runner' ? 0.85 : 1.0;

            const skinTex = createZombieTexture(170, 140, 115);
            const clothTex = createZombieTexture(60, 55, 50);
            const pantsTex = createZombieTexture(40, 45, 55);

            const skinMat = new THREE.MeshStandardMaterial({ map: skinTex, roughness: 0.65, metalness: 0.02 });
            const clothMat = new THREE.MeshStandardMaterial({ map: clothTex, roughness: 0.8, metalness: 0.03 });
            const pantsMat = new THREE.MeshStandardMaterial({ map: pantsTex, roughness: 0.8, metalness: 0.03 });

            // Piernas
            const legGeo = new THREE.CylinderGeometry(0.15 * s, 0.19 * s, 0.8 * s, 8);
            const legL = new THREE.Mesh(legGeo, pantsMat);
            legL.position.set(-0.18 * s, 0.4 * s, 0);
            legL.castShadow = true;
            const legR = new THREE.Mesh(legGeo, pantsMat);
            legR.position.set(0.18 * s, 0.4 * s, 0);
            legR.castShadow = true;
            group.add(legL, legR);
            group.userData.legs = [legL, legR];

            // Torso
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55 * s, 0.7 * s, 0.35 * s), clothMat);
            torso.position.y = 1.05 * s;
            torso.castShadow = true;
            group.add(torso);

            // Cabeza con detalles
            const headGroup = new THREE.Group();
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22 * s, 16, 14), skinMat);
            head.castShadow = true;
            headGroup.add(head);

            // Ojos
            const eyeGeo = new THREE.SphereGeometry(0.06 * s, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
            const eyeGlowGeo = new THREE.SphereGeometry(0.09 * s, 8, 8);
            const eyeGlowMat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.5,
            depthTest: false });
            [-1, 1].forEach(side => {
                const eye = new THREE.Mesh(eyeGeo, eyeMat);
                eye.position.set(side * 0.08 * s, 0.03 * s, 0.18 * s);
                const glow = new THREE.Mesh(eyeGlowGeo, eyeGlowMat);
                glow.position.copy(eye.position);
                headGroup.add(eye, glow);
            });

            // Boca
            const mouth = new THREE.Mesh(
                new THREE.BoxGeometry(0.2 * s, 0.04 * s, 0.08 * s),
                new THREE.MeshStandardMaterial({ color: 0x3a0000, roughness: 0.4 })
            );
            mouth.position.set(0, -0.06 * s, 0.2 * s);
            headGroup.add(mouth);

            headGroup.position.y = 1.6 * s;
            group.add(headGroup);
            group.userData.head = headGroup;

            // Brazos
            const armGeo = new THREE.CylinderGeometry(0.1 * s, 0.12 * s, 0.7 * s, 6);
            const armL = new THREE.Mesh(armGeo, skinMat);
            armL.position.set(-0.4 * s, 1.2 * s, 0);
            armL.rotation.z = 0.3;
            armL.castShadow = true;
            const armR = new THREE.Mesh(armGeo, skinMat);
            armR.position.set(0.4 * s, 1.2 * s, 0);
            armR.rotation.z = -0.3;
            armR.castShadow = true;
            group.add(armL, armR);
            group.userData.arms = [armL, armR];

            group.scale.setScalar(s);
            return group;
        }

        function spawnZombie(type) {

        // ==================== DISPARO ====================
        const raycaster = new THREE.Raycaster();
        raycaster.far = 120;

        function shoot() {
            const wp = player.weapons[player.weapon];
            if (player.reloading || player.cooldown > 0) return;
            if (wp.ammo <= 0) { startReload(); return; }

            wp.ammo--;
            player.cooldown = wp.fireRate;
            player.recoilAmount = 0.12;
            triggerMuzzleFlash();

            switch (player.weapon) {
                case 'pistol':
                    audio.pistol();
                    break;
                case 'smg':
                    audio.smg();
                    break;
                case 'shotgun':
                    audio.shotgun();
                    break;
                case 'rifle':
                    audio.rifle();
                    break;
            }

            for (let p = 0; p < wp.pellets; p++) {
                const sx = (Math.random() - 0.5) * wp.spread * 2;
                const sy = (Math.random() - 0.5) * wp.spread * 2;
                const dir = new THREE.Vector3(0, 0, -1).applyEuler(
                    new THREE.Euler(player.pitch + sy, player.yaw + sx, 0, 'YXZ')
                );
                raycaster.set(camera.position, dir);

                let bestZ = null,
                    bestDist = Infinity;
                for (const z of zombies) {
                    if (!z.alive || z.dying) continue;
                    const hits = raycaster.intersectObject(z.mesh, true);
                    if (hits.length > 0 && hits[0].distance < bestDist) {
                        bestZ = z;
                        bestDist = hits[0].distance;
                    }
                }

                if (bestZ) {
                    bestZ.hp -= wp.dmg;
                    bestZ.hitFlash = 0.12;
                    const hitPoint = raycaster.ray.origin.clone().add(dir.clone().multiplyScalar(bestDist));
                    spawnBloodBurst(hitPoint, 15);
                    showHitmarker();

                    if (bestZ.hp <= 0 && bestZ.alive) {
                        bestZ.dying = true;
                        bestZ.alive = false;
                        player.score += bestZ.score;
                        player.kills++;
                        player.scrap += bestZ.scrap;
                        audio.death();
                        spawnBloodBurst(bestZ.mesh.position.clone().add(new THREE.Vector3(0, 1, 0)), 30);
                    }
                }
            }

            if (wp.ammo <= 0) setTimeout(() => startReload(), 200);
        }

        function startReload() {
            const wp = player.weapons[player.weapon];
            if (player.reloading || wp.ammo >= wp.maxAmmo || wp.reserve <= 0) return;
            player.reloading = true;
            player.reloadTimer = 1.5;
            audio.reload();
        }

        function switchWeapon(name) {
            if (!player.weapons[name] || !player.weapons[name].unlocked) return;
            if (player.weapon === name) return;
            player.weapon = name;
            const wp = player.weapons[name];
            wp.ammo = Math.min(wp.maxAmmo, wp.reserve);
            wp.reserve -= wp.ammo;
            player.reloading = false;
            player.cooldown = 0.25;
            document.getElementById('weaponName').textContent = wp.name;
        }

        function showHitmarker() {
            const el = document.getElementById('hitmarker');
            el.classList.remove('active');
            void el.offsetWidth;
            el.classList.add('active');
        }

        // ==================== ENTRADA ====================
        const keys = {};

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyQ') player.yaw += 0.08;
            if (e.code === 'KeyE') player.yaw -= 0.08;
            if (e.code === 'Semicolon' || e.key === 'ñ' || e.key === 'Ñ') { mouseDown = true;
                e.preventDefault(); }
            if (e.code === 'KeyR') startReload();
            if (e.code === 'Digit1') switchWeapon('pistol');
            if (e.code === 'Digit2') switchWeapon('smg');
            if (e.code === 'Digit3') switchWeapon('shotgun');
            if (e.code === 'Digit4') switchWeapon('rifle');
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
            if (e.code === 'Semicolon' || e.key === 'ñ' || e.key === 'Ñ') mouseDown = false;
        });
        window.addEventListener('mousedown', e => { if (e.button === 0) mouseDown = true; });
        window.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === renderer.domElement) {
                player.yaw -= e.movementX * 0.0025;
                player.pitch -= e.movementY * 0.0025;
                player.pitch = THREE.MathUtils.clamp(player.pitch, -Math.PI / 2.2, Math.PI / 2.2);
            }
        });
        renderer.domElement.addEventListener('click', () => {
            if (gameState === 'playing' && document.pointerLockElement !== renderer.domElement && !('ontouchstart' in
                    window)) {
                renderer.domElement.requestPointerLock();
            }
        });

        // Controles táctiles
        function setupTouch() {
            const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent) || window.innerWidth < 768;
            if (isMobile) document.getElementById('touchUI').classList.add('on');

            const moveStick = document.getElementById('moveStick');
            const moveNub = document.getElementById('moveNub');
            const lookStick = document.getElementById('lookStick');
            const lookNub = document.getElementById('lookNub');

            moveStick.addEventListener('touchstart', e => { e.preventDefault();
                touchMove.active = true;
                updateMove(e.touches[0]); });
            moveStick.addEventListener('touchmove', e => { e.preventDefault();
                updateMove(e.touches[0]); });
            moveStick.addEventListener('touchend', () => { touchMove.active = false;
                touchMove.x = 0;
                touchMove.y = 0;
                moveNub.style.transform = 'translate(-50%, -50%)'; });

            function updateMove(touch) {
                const r = moveStick.getBoundingClientRect();
                const cx = r.left + r.width / 2;
                const cy = r.top + r.height / 2;
                const dx = touch.clientX - cx,
                    dy = touch.clientY - cy;
                const maxD = 48;
                const dist = Math.min(Math.sqrt(dx * dx + dy * dy), maxD);
                const ang = Math.atan2(dy, dx);
                touchMove.x = (Math.cos(ang) * dist) / maxD;
                touchMove.y = (Math.sin(ang) * dist) / maxD;
                moveNub.style.transform = `translate(calc(-50% + ${touchMove.x*42}px), calc(-50% + ${touchMove.y*42}px))`;
            }

            lookStick.addEventListener('touchmove', e => {
                e.preventDefault();
                if (e.touches.length > 0) {
                    const r = lookStick.getBoundingClientRect();
                    const cx = r.left + r.width / 2,
                        cy = r.top + r.height / 2;
                    const dx = e.touches[0].clientX - cx,
                        dy = e.touches[0].clientY - cy;
                    player.yaw -= dx * 0.005;
                    player.pitch -= dy * 0.005;
                    player.pitch = THREE.MathUtils.clamp(player.pitch, -Math.PI / 2.2, Math.PI / 2.2);
                    lookNub.style.transform = `translate(calc(-50% + ${dx*0.5}px), calc(-50% + ${dy*0.5}px))`;
                }
            });
            lookStick.addEventListener('touchend', () => { lookNub.style.transform = 'translate(-50%, -50%)'; });

            document.getElementById('btnShoot').addEventListener('touchstart', e => { e.preventDefault();
                touchShooting = true; });
            document.getElementById('btnShoot').addEventListener('touchend', () => { touchShooting = false; });
            document.getElementById('btnReload').addEventListener('touchstart', e => { e.preventDefault();
                startReload(); });
            document.getElementById('btnSwitch').addEventListener('touchstart', e => {
                e.preventDefault();
                const ws = ['pistol', 'smg', 'shotgun', 'rifle'];
                const idx = ws.indexOf(player.weapon);
                for (let i = 1; i < ws.length; i++) {
                    const n = ws[(idx + i) % ws.length];
                    if (player.weapons[n].unlocked) { switchWeapon(n); break; }
                }
            });
        }
        setupTouch();

        // ==================== TIENDA ====================
        function openShop() {
            gameState = 'shop';
            document.getElementById('shopScreen').classList.remove('hidden');
            document.getElementById('shopScrap').textContent = player.scrap;
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            const items = [
                { n: 'SUBFUSIL (300)', c: !player.weapons.smg.unlocked, a: () => { if (player.scrap >= 300) { player.weapons
                            .smg.unlocked = true;
                        player.scrap -= 300;
                        audio.pickup();
                        openShop(); } } },
                { n: 'ESCOPETA (500)', c: !player.weapons.shotgun.unlocked, a: () => { if (player.scrap >= 500) { player
                            .weapons.shotgun.unlocked = true;
                        player.scrap -= 500;
                        audio.pickup();
                        openShop(); } } },
                { n: '+40 VIDA (300)', c: true, a: () => { if (player.scrap >= 300) { player.maxHp += 40;
                        player.hp = Math.min(player.hp + 40, player.maxHp);
                        player.scrap -= 300;
                        audio.pickup();
                        openShop(); } } },
                { n: 'MUNICIÓN (180)', c: true, a: () => { if (player.scrap >= 180) { const wp = player.weapons[player
                            .weapon];
                        wp.ammo = wp.maxAmmo;
                        wp.reserve = 60;
                        player.scrap -= 180;
                        audio.pickup();
                        openShop(); } } },
                { n: 'VELOCIDAD (350)', c: true, a: () => { if (player.scrap >= 350) { player.speed += 0.7;
                        player.scrap -= 350;
                        audio.pickup();
                        openShop(); } } }
            ];
            items.forEach(it => {
                if (!it.c) return;
                const b = document.createElement('button');
                b.className = 'btn btn-sm';
                b.textContent = it.n;
                b.addEventListener('click', it.a);
                grid.appendChild(b);
            });
        }

        // ==================== GAME STATE ====================
        let gameState = 'menu';

        // ==================== BUCLE PRINCIPAL ====================
        const clock = new THREE.Clock();

        function update(dt) {
            if (gameState !== 'playing') return;

            let mx = 0,
                mz = 0;
            if (keys['KeyP']) mz -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
            if (touchMove.active) { mx += touchMove.x;
                mz -= touchMove.y; }

            if (mx !== 0 || mz !== 0) {
                const len = Math.sqrt(mx * mx + mz * mz);
                mx /= len;
                mz /= len;
                const sprint = (keys['ShiftLeft'] || keys['ShiftRight']) && player.stamina > 3;
                const spd = sprint ? player.speed * 1.5 : player.speed;
                if (sprint) player.stamina -= 22 * dt;
                else player.stamina = Math.min(player.maxStamina, player.stamina + 14 * dt);

                const cos = Math.cos(player.yaw),
                    sin = Math.sin(player.yaw);
                const wx = mx * cos - mz * sin,
                    wz = mx * sin + mz * cos;
                player.vel.x += (wx * spd - player.vel.x) * 9 * dt;
                player.vel.z += (wz * spd - player.vel.z) * 9 * dt;
            } else {
                player.vel.x *= Math.exp(-7 * dt);
                player.vel.z *= Math.exp(-7 * dt);
                player.stamina = Math.min(player.maxStamina, player.stamina + 14 * dt);
            }

            player.pos.x += player.vel.x * dt;
            player.pos.z += player.vel.z * dt;

            for (const o of obstacles) {
                const dx = player.pos.x - o.x,
                    dz = player.pos.z - o.z;
                const dist = Math.sqrt(dx * dx + dz * dz),
                    minDist = o.r + 0.5;
                if (dist < minDist && dist > 0.001) {
                    player.pos.x = o.x + (dx / dist) * minDist;
                    player.pos.z = o.z + (dz / dist) * minDist;
                }
            }
            const d = Math.sqrt(player.pos.x ** 2 + player.pos.z ** 2);
            if (d > 50) { player.pos.x *= 50 / d;
                player.pos.z *= 50 / d; }

            camera.position.set(player.pos.x, 1.75, player.pos.z);
            camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

            if (player.reloading) {
                player.reloadTimer -= dt;
                if (player.reloadTimer <= 0) {
                    const wp = player.weapons[player.weapon];
                    const need = wp.maxAmmo - wp.ammo,
                        take = Math.min(need, wp.reserve);
                    wp.ammo += take;
                    wp.reserve -= take;
                    player.reloading = false;
                }
            }

            if (player.cooldown > 0) player.cooldown -= dt;
            player.recoilAmount *= Math.exp(-13 * dt);
            weaponGroup.rotation.x = -player.recoilAmount * 2.5;

            const isShooting = mouseDown || touchShooting;
            if (isShooting && player.cooldown <= 0 && !player.reloading) {
                const wp = player.weapons[player.weapon];
                if (wp.auto || player.cooldown <= 0) shoot();
            }

            if (waveActive && toSpawn > 0) {
                spawnCd -= dt;
                if (spawnCd <= 0) {
                    let type = 'walker';
                    if (wave % 5 === 0) type = 'brute';
                    else if (wave >= 3 && Math.random() < 0.35) type = 'runner';
                    spawnZombie(type);
                    toSpawn--;
                    spawnCd = 0.4 + Math.random() * 1.4;
                }
            }

            for (let i = zombies.length - 1; i >= 0; i--) {
                const z = zombies[i];
                if (z.dying) {
                    z.deathTimer += dt;
                    z.mesh.position.y -= 1.5 * dt;
                    z.mesh.rotation.z += 2 * dt;
                    if (z.deathTimer > 1.8) { scene.remove(z.mesh);
                        zombies.splice(i, 1); }
                    continue;
                }
                if (z.hitFlash > 0) z.hitFlash -= dt;
                z.groanTimer -= dt;
                if (z.groanTimer <= 0 && Math.random() < 0.3) { audio.groan();
                    z.groanTimer = 2.5 + Math.random() * 5; }

                const dx = player.pos.x - z.mesh.position.x,
                    dz = player.pos.z - z.mesh.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist < 1.6 && z.atkCd <= 0) {
                    player.hp -= z.damage;
                    z.atkCd = 0.9;
                    audio.hurt();
                    const df = document.getElementById('damageFlash');
                    df.classList.add('active');
                    setTimeout(() => df.classList.remove('active'), 130);
                }
                if (z.atkCd > 0) z.atkCd -= dt;
                if (dist > 1.3) {
                    z.mesh.position.x += (dx / dist) * z.speed * dt;
                    z.mesh.position.z += (dz / dist) * z.speed * dt;
                }
                z.mesh.lookAt(new THREE.Vector3(player.pos.x, 0.8, player.pos.z));
                z.walkPhase += dt * z.speed * 3;
                if (z.mesh.userData.legs) {
                    z.mesh.userData.legs[0].rotation.x = Math.sin(z.walkPhase) * 0.5;
                    z.mesh.userData.legs[1].rotation.x = -Math.sin(z.walkPhase) * 0.5;
                }
                if (z.mesh.userData.arms) {
                    z.mesh.userData.arms[0].rotation.x = -Math.sin(z.walkPhase) * 0.3;
                    z.mesh.userData.arms[1].rotation.x = Math.sin(z.walkPhase) * 0.3;
                }
            }

            for (let i = bloodParticles.length - 1; i >= 0; i--) {
                const p = bloodParticles[i];
                p.userData.age += dt;
                if (p.userData.age >= p.userData.life) { scene.remove(p);
                    bloodParticles.splice(i, 1); continue; }
                p.userData.vel.y -= 14 * dt;
                p.position.add(p.userData.vel.clone().multiplyScalar(dt));
                if (p.position.y < 0.03) { p.position.y = 0.03;
                    p.userData.vel.set(0, 0, 0); }
                p.scale.setScalar(Math.max(0.02, 1 - p.userData.age / p.userData.life));
            }

            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                const p = smokeParticles[i];
                p.userData.age += dt;
                if (p.userData.age >= p.userData.life) { camera.remove(p);
                    smokeParticles.splice(i, 1); continue; }
                p.position.add(p.userData.vel.clone().multiplyScalar(dt));
                p.material.opacity = 0.5 * (1 - p.userData.age / p.userData.life);
                p.scale.setScalar(1 + p.userData.age * 3);
            }

            if (waveActive && toSpawn === 0 && zombies.length === 0) {
                waveActive = false;
                player.scrap += 20 + wave * 6;
                openShop();
            }

            if (player.hp <= 0) {
                player.hp = 0;
                gameState = 'gameover';
                document.getElementById('gameOverScreen').classList.remove('hidden');
                document.getElementById('goWave').textContent = wave;
                document.getElementById('goKills').textContent = player.kills;
                document.getElementById('goScore').textContent = player.score;
                if (document.pointerLockElement === renderer.domElement) document.exitPointerLock();
            }

            document.getElementById('hpText').textContent = Math.ceil(player.hp);
            document.getElementById('maxHpText').textContent = player.maxHp;
            document.getElementById('healthBarFill').style.width = (player.hp / player.maxHp * 100) + '%';
            document.getElementById('staminaFill').style.width = (player.stamina / player.maxStamina * 100) + '%';
            const wp = player.weapons[player.weapon];
            document.getElementById('ammoCount').textContent = wp.ammo;
            document.getElementById('ammoReserveVal').textContent = wp.reserve;
            document.getElementById('reloadIndicator').textContent = player.reloading ? 'RECARGANDO...' : '';
            document.getElementById('scoreNum').textContent = player.score;
            document.getElementById('scrapNum').textContent = player.scrap;
            document.getElementById('zombieCount').textContent = toSpawn + zombies.length;
        }

        function animate() {
            requestAnimationFrame(animate);
            update(Math.min(clock.getDelta(), 0.1));
            renderer.render(scene, camera);
        }

        document.getElementById('btnPlay').addEventListener('click', () => {
            audio.init();
            document.getElementById('mainMenu').classList.add('hidden');
            gameState = 'playing';
            player.pos.set(0, 1.75, 10);
            player.hp = player.maxHp;
            player.stamina = player.maxStamina;
            player.yaw = Math.PI;
            player.pitch = 0;
            player.score = 0;
            player.kills = 0;
            player.scrap = 0;
            player.weapons.smg.unlocked = false;
            player.weapons.shotgun.unlocked = false;
            player.weapon = 'pistol';
            for (const k in player.weapons) {
                const w = player.weapons[k];
                w.ammo = w.maxAmmo;
                w.reserve = k === 'pistol' ? 60 : w.maxAmmo * 4;
            }
            player.reloading = false;
            zombies.forEach(z => scene.remove(z.mesh));
            zombies.length = 0;
            bloodParticles.forEach(p => scene.remove(p));
            bloodParticles.length = 0;
            smokeParticles.forEach(p => camera.remove(p));
            smokeParticles.length = 0;
            waveActive = false;
            startWave(1);
            if (!('ontouchstart' in window)) renderer.domElement.requestPointerLock();
        });

        document.getElementById('btnRetry').addEventListener('click', () => {
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('btnPlay').click();
        });
        document.getElementById('btnMenu').addEventListener('click', () => {
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('shopScreen').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
            gameState = 'menu';
            zombies.forEach(z => scene.remove(z.mesh));
            zombies.length = 0;
            bloodParticles.forEach(p => scene.remove(p));
            bloodParticles.length = 0;
            waveActive = false;
        });
        document.getElementById('btnNextWave').addEventListener('click', () => {
            document.getElementById('shopScreen').classList.add('hidden');
            gameState = 'playing';
            startWave(wave + 1);
            if (!('ontouchstart' in window)) renderer.domElement.requestPointerLock();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
        console.log('🔥 NEKROPOLIS: CARNAGE EDITION - ¡JUEGO COMPLETO!');
    </script>
</body>
</html>
